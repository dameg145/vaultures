<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="site-title-tag">🦅 VAULTURE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Oxanium:wght@400;700&family=Russo+One&family=Exo+2:wght@400;700&family=Share+Tech+Mono&family=VT323&family=Permanent+Marker&family=Oswald:wght@400;700&family=Press+Start+2P&family=Monoton&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#f0ede6;font-family:'Space Mono',monospace;min-height:100vh;overflow-x:hidden}
input,select,textarea{background:#1a1a1a;border:1px solid #333;color:#f0ede6;font-family:'Space Mono',monospace;padding:8px 12px;border-radius:3px;font-size:13px;width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:#e8c547}
button{cursor:pointer;font-family:'Space Mono',monospace;transition:all .15s}
.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:3px}

@keyframes spin-cw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-ccw{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:.7}50%{opacity:.2}55%{opacity:.9}}
@keyframes fadeUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideIn{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulse-gold{0%,100%{box-shadow:0 0 0 0 rgba(232,197,71,.4)}50%{box-shadow:0 0 0 8px rgba(232,197,71,0)}}
@keyframes riff{0%,100%{transform:translateY(0)}25%{transform:translateY(-5px)}75%{transform:translateY(2px)}}
@keyframes sold-stamp{0%{transform:rotate(-20deg) scale(2);opacity:0}100%{transform:rotate(-15deg) scale(1);opacity:1}}

.gear-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.gear{position:absolute;opacity:.035}
.g1{width:210px;height:210px;top:-50px;right:-50px;animation:spin-cw 24s linear infinite}
.g2{width:120px;height:120px;top:50px;right:130px;animation:spin-ccw 14s linear infinite}
.g3{width:300px;height:300px;bottom:-90px;left:-70px;animation:spin-cw 32s linear infinite}
.g4{width:90px;height:90px;bottom:70px;left:200px;animation:spin-ccw 10s linear infinite}
.g5{width:150px;height:150px;top:50%;left:50%;animation:spin-cw 18s linear infinite;opacity:.02}

.logo-flicker{animation:flicker 9s infinite}
.fade-up{animation:fadeUp .35s ease both}

.btn{background:#e8c547;color:#111;border:none;padding:9px 18px;border-radius:3px;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-family:'Space Mono',monospace;position:relative;overflow:hidden}
.btn:hover{opacity:1;transform:translateY(-1px);box-shadow:0 4px 14px rgba(232,197,71,.3)}
.btn:active{transform:translateY(0)}
.btn-ghost{background:#1a1a1a;color:#f0ede6;border:1px solid #2a2a2a}
.btn-ghost:hover{border-color:#e8c547;color:#e8c547;box-shadow:none;transform:none}
.btn-danger{background:#c0392b;color:#fff;border:none}
.btn-danger:hover{box-shadow:0 4px 12px rgba(192,57,43,.3)}
.btn-success{background:#27ae60;color:#fff;border:none}
.btn-warning{background:#e67e22;color:#fff;border:none}
.btn-sm{padding:6px 12px;font-size:11px}

header{background:rgba(13,13,13,.97);backdrop-filter:blur(10px);border-bottom:1px solid #1a1a1a;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:200}
.view{display:none;position:relative;z-index:1}
.view.active{display:block}
.container{max-width:1240px;margin:0 auto;padding:28px 20px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}

.product-card{background:#111;border:1px solid #1e1e1e;border-radius:5px;padding:16px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.product-card:hover{border-color:#e8c547;transform:translateY(-3px);box-shadow:0 8px 28px rgba(232,197,71,.1)}
.product-card.sold-out{cursor:default}
.product-card.sold-out:hover{transform:none;border-color:#1e1e1e;box-shadow:none}
.sold-stamp{position:absolute;inset:0;background:rgba(13,13,13,.75);display:flex;align-items:center;justify-content:center;z-index:5}
.sold-stamp-inner{border:3px solid #c0392b;color:#c0392b;font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:4px;padding:6px 18px;transform:rotate(-15deg);opacity:.9;animation:sold-stamp .4s ease}

.badge{display:inline-block;background:#c0392b;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;letter-spacing:1px;text-transform:uppercase}
.badge-sale{position:absolute;top:10px;right:10px;z-index:2}
.badge-low{position:absolute;top:10px;left:10px;z-index:2;background:#e67e22}

.filter-btn{background:#111;color:#555;border:1px solid #1e1e1e;padding:7px 14px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:'Space Mono',monospace;transition:all .2s}
.filter-btn.active,.filter-btn:hover{background:#e8c547;color:#111;border-color:#e8c547}

.qty-btn{background:#1a1a1a;border:1px solid #2a2a2a;color:#f0ede6;width:30px;height:30px;border-radius:3px;cursor:pointer;font-size:18px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.qty-btn:hover{background:#e8c547;color:#111;border-color:#e8c547}

.card-panel{background:#111;border:1px solid #1e1e1e;border-radius:4px;padding:18px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}

.step-bar{display:flex;margin-bottom:24px;gap:2px}
.step{flex:1;border-bottom:2px solid #1a1a1a;padding-bottom:8px;font-size:11px;color:#2a2a2a;letter-spacing:1px;text-transform:uppercase;font-weight:700;transition:all .3s}
.step.active{border-color:#e8c547;color:#e8c547}
.step.done{border-color:#27ae60;color:#27ae60}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:10px}

.notif{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:3px;font-weight:700;font-size:13px;z-index:9999;display:none;letter-spacing:1px;white-space:nowrap;animation:slideIn .3s ease;font-family:'Space Mono',monospace}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:8000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-overlay.open{display:flex}
.modal-box{background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:28px;width:100%;max-width:440px;position:relative;animation:fadeUp .3s ease;max-height:90vh;overflow-y:auto}

.admin-tab{background:#0a0a0a;border:1px solid #1a1a1a;color:#444;padding:9px 14px;border-radius:3px 3px 0 0;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:'Space Mono',monospace;border-bottom:none;transition:all .2s;white-space:nowrap}
.admin-tab.active{background:#111;color:#e8c547;border-color:#2a2a2a}
.admin-tab-content{display:none}
.admin-tab-content.active{display:block;animation:fadeUp .2s ease}
.tab-bar{display:flex;margin-bottom:0;border-bottom:1px solid #2a2a2a;flex-wrap:wrap;gap:2px}

.editor-toolbar{display:flex;gap:3px;flex-wrap:wrap;padding:7px 10px;background:#080808;border:1px solid #2a2a2a;border-bottom:none;border-radius:3px 3px 0 0}
.editor-toolbar button{background:#141414;border:1px solid #222;color:#ccc;padding:4px 8px;border-radius:2px;font-size:11px;font-weight:700;min-width:26px;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:'Space Mono',monospace}
.editor-toolbar button:hover{background:#e8c547;color:#111;border-color:#e8c547;opacity:1;transform:none}
.editor-toolbar .sep{width:1px;background:#1e1e1e;margin:2px 3px;align-self:stretch}
.rich-editor{background:#141414;border:1px solid #2a2a2a;color:#f0ede6;font-family:'Space Mono',monospace;padding:12px;border-radius:0 0 3px 3px;font-size:13px;width:100%;min-height:90px;outline:none;line-height:1.7}
.rich-editor:focus{border-color:#e8c547}
.rich-editor:empty::before{content:attr(data-ph);color:#333;pointer-events:none}

.img-upload-area{border:2px dashed #2a2a2a;border-radius:4px;padding:22px;text-align:center;cursor:pointer;transition:all .2s;background:#0a0a0a}
.img-upload-area:hover{border-color:#e8c547;background:#111}

.checkbox-wrap{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#777}
.checkbox-wrap input[type=checkbox]{width:auto;cursor:pointer;accent-color:#e8c547}

.delivery-opt,.payment-opt{border:1px solid #1e1e1e;border-radius:4px;padding:13px 15px;cursor:pointer;transition:all .2s;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.delivery-opt:hover,.payment-opt:hover{border-color:#555}
.delivery-opt.sel,.payment-opt.sel{border-color:#e8c547;background:#111}
.delivery-opt input,.payment-opt input{accent-color:#e8c547;margin-top:2px;flex-shrink:0;cursor:pointer;width:auto}

#chat-bubble{position:fixed;bottom:24px;right:24px;background:#e8c547;color:#111;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;z-index:9000;border:none;box-shadow:0 4px 20px rgba(232,197,71,.4);animation:pulse-gold 3s infinite}
#chat-window{position:fixed;bottom:88px;right:24px;width:330px;background:#111;border:1px solid #2a2a2a;border-radius:6px;z-index:9000;display:none;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.7);max-height:480px}
#chat-window.open{display:flex;animation:fadeUp .25s ease}
#chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:300px}
.chat-msg{max-width:84%;padding:9px 13px;border-radius:4px;font-size:12px;line-height:1.5}
.chat-msg.support{background:#1a1a1a;color:#ccc;align-self:flex-start;border:1px solid #222}
.chat-msg.user{background:#e8c547;color:#111;align-self:flex-end;font-weight:700}

.gift-coupon{background:linear-gradient(135deg,#181818,#111);border:2px solid #e8c547;border-radius:8px;padding:18px 22px;position:relative;overflow:hidden}
.gift-coupon::after{content:'';position:absolute;right:-16px;top:50%;transform:translateY(-50%);width:32px;height:32px;background:#0d0d0d;border-radius:50%;border:2px solid #e8c547}
.gift-coupon::before{content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:32px;height:32px;background:#0d0d0d;border-radius:50%;border:2px solid #e8c547}

.order-badge{display:inline-block;padding:2px 9px;border-radius:2px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.ob-pending{background:#2a2a1a;color:#e8c547;border:1px solid #3a3a1a}
.ob-confirmed{background:#1a2e1a;color:#27ae60;border:1px solid #1e3e1e}
.ob-cancelled{background:#2e1a1a;color:#c0392b;border:1px solid #3e1e1e}
.ob-shipped{background:#1a1e2e;color:#3498db;border:1px solid #1e223e}

.color-swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:inline-block;transition:all .15s}
.color-swatch:hover,.color-swatch.active{border-color:#e8c547;transform:scale(1.15)}
.color-swatch-pick{width:20px;height:20px;border-radius:3px;cursor:pointer;border:1px solid #333;display:inline-block;transition:transform .15s;flex-shrink:0}
.color-swatch-pick:hover{transform:scale(1.2)}

.var-tag{display:inline-flex;align-items:center;gap:6px;background:#1a1a1a;border:1px solid #2a2a2a;padding:4px 10px;border-radius:20px;font-size:11px;margin:3px;cursor:pointer;transition:all .15s}
.var-tag:hover,.var-tag.active{border-color:#e8c547;color:#e8c547}
.var-tag .rm{color:#555;font-size:14px;line-height:1;cursor:pointer}
.var-tag .rm:hover{color:#c0392b}

.stat-card{background:#111;border:1px solid #1e1e1e;border-radius:4px;padding:16px;text-align:center}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:34px;color:#e8c547;letter-spacing:2px;line-height:1}
.stat-label{font-size:10px;color:#444;letter-spacing:2px;text-transform:uppercase;margin-top:4px}

@media(max-width:700px){.two-col,.three-col{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}#chat-window{width:calc(100vw - 32px);right:16px}.tab-bar .admin-tab{font-size:9px;padding:7px 9px}}
</style>
</head>
<body>

<!-- GEARS -->
<div class="gear-bg" aria-hidden="true">
<svg class="gear g1" viewBox="0 0 100 100" fill="#e8c547"><path d="M43 5l-3 8c-2 .4-4 1-5 2L27 11 19 19l4 7c-1 2-2 3-2 5L13 35v12l8 3c0 2 1 4 2 5l-4 7 8 8 7-3c2 1 3 1 5 2l3 8h13l3-8c2-1 4-1 5-2l7 3 9-8-4-7c1-2 2-3 2-5l8-3V35l-8-3c0-2-1-4-2-5l4-7-9-8-7 3c-2-1-3-2-5-2l-3-8H43zm6 28a16 16 0 110 32 16 16 0 010-32z"/></svg>
<svg class="gear g2" viewBox="0 0 100 100" fill="#e8c547"><path d="M43 5l-3 8c-2 .4-4 1-5 2L27 11 19 19l4 7c-1 2-2 3-2 5L13 35v12l8 3c0 2 1 4 2 5l-4 7 8 8 7-3c2 1 3 1 5 2l3 8h13l3-8c2-1 4-1 5-2l7 3 9-8-4-7c1-2 2-3 2-5l8-3V35l-8-3c0-2-1-4-2-5l4-7-9-8-7 3c-2-1-3-2-5-2l-3-8H43zm6 28a16 16 0 110 32 16 16 0 010-32z"/></svg>
<svg class="gear g3" viewBox="0 0 100 100" fill="#e8c547"><path d="M43 5l-3 8c-2 .4-4 1-5 2L27 11 19 19l4 7c-1 2-2 3-2 5L13 35v12l8 3c0 2 1 4 2 5l-4 7 8 8 7-3c2 1 3 1 5 2l3 8h13l3-8c2-1 4-1 5-2l7 3 9-8-4-7c1-2 2-3 2-5l8-3V35l-8-3c0-2-1-4-2-5l4-7-9-8-7 3c-2-1-3-2-5-2l-3-8H43zm6 28a16 16 0 110 32 16 16 0 010-32z"/></svg>
<svg class="gear g4" viewBox="0 0 100 100" fill="#e8c547"><path d="M43 5l-3 8c-2 .4-4 1-5 2L27 11 19 19l4 7c-1 2-2 3-2 5L13 35v12l8 3c0 2 1 4 2 5l-4 7 8 8 7-3c2 1 3 1 5 2l3 8h13l3-8c2-1 4-1 5-2l7 3 9-8-4-7c1-2 2-3 2-5l8-3V35l-8-3c0-2-1-4-2-5l4-7-9-8-7 3c-2-1-3-2-5-2l-3-8H43zm6 28a16 16 0 110 32 16 16 0 010-32z"/></svg>
<svg class="gear g5" viewBox="0 0 100 100" fill="#e8c547"><path d="M43 5l-3 8c-2 .4-4 1-5 2L27 11 19 19l4 7c-1 2-2 3-2 5L13 35v12l8 3c0 2 1 4 2 5l-4 7 8 8 7-3c2 1 3 1 5 2l3 8h13l3-8c2-1 4-1 5-2l7 3 9-8-4-7c1-2 2-3 2-5l8-3V35l-8-3c0-2-1-4-2-5l4-7-9-8-7 3c-2-1-3-2-5-2l-3-8H43zm6 28a16 16 0 110 32 16 16 0 010-32z"/></svg>
</div>

<div class="notif" id="notif"></div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal-box">
    <button onclick="closeAuthModal()" style="position:absolute;top:12px;right:14px;background:none;border:none;color:#444;font-size:20px;cursor:pointer">✕</button>
    <div id="auth-modal-content"></div>
  </div>
</div>

<!-- ORDER TRACKING MODAL -->
<div class="modal-overlay" id="track-modal">
  <div class="modal-box" style="max-width:520px">
    <button onclick="document.getElementById('track-modal').classList.remove('open')" style="position:absolute;top:12px;right:14px;background:none;border:none;color:#444;font-size:20px;cursor:pointer">✕</button>
    <div id="track-modal-content"></div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div onclick="showView('shop')" style="cursor:pointer;display:flex;align-items:baseline;gap:10px">
    <span class="bebas logo-flicker" id="header-logo" style="font-size:26px;color:#e8c547">🦅 VAULTURE</span>
    <span id="header-tagline" style="font-size:9px;color:#333;letter-spacing:2px;text-transform:uppercase">Vintage · Rock · Metal</span>
  </div>
  <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-ghost btn-sm" onclick="openTrackModal()">🔍 Track Order</button>
    <button class="btn btn-ghost btn-sm" id="auth-btn" onclick="handleAuthClick()">Login</button>
    <button class="btn btn-ghost btn-sm" onclick="showView('admin')">⚙ Admin</button>
    <button class="btn btn-sm" onclick="showView('cart')">🛒 <span id="cart-count" style="display:none;background:#c0392b;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;align-items:center;justify-content:center;display:none;margin-left:3px">0</span></button>
  </div>
</header>

<!-- SHOP -->
<div id="view-shop" class="view active">
  <div class="container">
    <div class="bebas fade-up" id="shop-headline" style="font-size:54px;line-height:1;margin-bottom:4px"><span style="color:#e8c547">VINTAGE</span> ROCK &amp; METAL</div>
    <p id="shop-subline" style="color:#444;font-size:11px;letter-spacing:2px;margin-bottom:24px;text-transform:uppercase">Authentic. Rare. Loud.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <input id="search-box" placeholder="Search products..." oninput="renderShop()" style="width:200px">
      <select id="sort-box" onchange="renderShop()" style="width:180px">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
        <option value="rating">Top Rated</option>
        <option value="new">Newest First</option>
      </select>
    </div>
    <div id="cat-buttons" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px"></div>
    <div class="product-grid" id="product-grid"></div>
  </div>
</div>

<!-- PRODUCT DETAIL -->
<div id="view-product" class="view">
  <div class="container">
    <button onclick="showView('shop')" style="background:none;border:none;color:#e8c547;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;margin-bottom:20px;letter-spacing:1px">← Back to Shop</button>
    <div id="product-detail-content"></div>
  </div>
</div>

<!-- CART -->
<div id="view-cart" class="view">
  <div class="container" style="max-width:760px">
    <div class="bebas" style="font-size:38px;margin-bottom:22px">YOUR CART</div>
    <div id="cart-content"></div>
  </div>
</div>

<!-- CHECKOUT -->
<div id="view-checkout" class="view">
  <div class="container" style="max-width:700px">
    <div class="bebas" style="font-size:34px;margin-bottom:10px">CHECKOUT</div>
    <div class="step-bar" id="checkout-steps"></div>
    <div id="checkout-content"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="view-admin" class="view">
  <div class="container">
    <div id="admin-content"></div>
  </div>
</div>

<!-- CHAT BUBBLE -->
<button id="chat-bubble" onclick="toggleChat()" title="Message Us">💬</button>
<div id="chat-window">
  <div style="background:#0a0a0a;padding:12px 16px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;border-radius:6px 6px 0 0">
    <div>
      <div class="bebas" id="chat-header-name" style="font-size:14px;color:#e8c547;letter-spacing:2px">🦅 VAULTURE SUPPORT</div>
      <div style="font-size:10px;color:#444">Direct message — we reply personally</div>
    </div>
    <button onclick="toggleChat()" style="background:none;border:none;color:#444;font-size:18px;cursor:pointer">✕</button>
  </div>
  <div id="chat-messages"></div>
  <div style="padding:10px;border-top:1px solid #1a1a1a;display:flex;gap:8px">
    <input id="chat-input" placeholder="Type your message..." style="font-size:12px" onkeydown="if(event.key==='Enter')sendChatMsg()">
    <button class="btn btn-sm" onclick="sendChatMsg()" style="flex-shrink:0">Send</button>
  </div>
</div>

<!-- FOOTER -->
<div style="border-top:1px solid #0f0f0f;padding:20px;text-align:center;margin-top:60px;position:relative;z-index:1">
  <span class="bebas" id="footer-text" style="font-size:13px;color:#1e1e1e;letter-spacing:3px">🦅 VAULTURE · VINTAGE ROCK METAL STREETWEAR · FREE SHIPPING OVER $150</span>
</div>

<script>
// ==================== SITE CONFIG ====================
let SC = {
  siteName: 'VAULTURE',
  logoEmoji: '🦅',
  tagline: 'Vintage · Rock · Metal',
  headline: 'VINTAGE ROCK & METAL',
  subline: 'Authentic. Rare. Loud.',
  footerText: '🦅 VAULTURE · VINTAGE ROCK METAL STREETWEAR · FREE SHIPPING OVER $150',

function notify(msg, type='gold') {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.style.background = type==='red'?'#c0392b':type==='green'?'#27ae60':SC.accentColor;
  n.style.color = type==='red'||type==='green' ? '#fff' : '#111';
  n.style.display='block';
  clearTimeout(n._t);
  n._t = setTimeout(()=>n.style.display='none', 3200);
}

function showView(v) {
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  window.scrollTo(0,0);
  if(v==='shop') renderShop();
  if(v==='cart') renderCart();
  if(v==='admin') renderAdmin();
  if(v==='checkout'){checkoutStep=1;renderCheckout();}
}

function starsHTML(rating,size=13,interactive=false) {
  return [1,2,3,4,5].map(i=>{
    const on=i<=Math.round(rating);
    return interactive
      ? `<span onclick="setRevStars(${i})" id="rstar-${i}" style="cursor:pointer;color:${on?SC.accentColor:'#2a2a2a'};font-size:${size}px;transition:color .15s">★</span>`
      : `<span style="color:${on?SC.accentColor:'#2a2a2a'};font-size:${size}px">★</span>`;
  }).join('');
}

function setRevStars(n) {
  reviewStars=n;
  [1,2,3,4,5].forEach(i=>{
    const el=document.getElementById('rstar-'+i);
    if(el) el.style.color=i<=n?SC.accentColor:'#2a2a2a';
  });
}

function updateCartBadge() {
  const total=cart.reduce((s,i)=>s+i.qty,0);
  const b=document.getElementById('cart-count');
  b.textContent=total; b.style.display=total>0?'inline-flex':'none';
}

function pImg(p,w=50,h=50) {
  if(p.imageUrl) return `<img src="${p.imageUrl}" style="width:${w}px;height:${h}px;object-fit:cover;border-radius:3px">`;
  return `<span style="font-size:${Math.min(w,h)*.55}px;line-height:1">${p.image||'📦'}</span>`;
}

function calcCart() {
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const sh=selectedDelivery==='ship'&&sub<150?9.99:0;
  let disc=0;
  if(appliedCoupon){
    if(appliedCoupon.type==='percent') disc=sub*appliedCoupon.value/100;
    else disc=Math.min(appliedCoupon.value,sub);
  }
  return {sub,sh,disc,total:Math.max(0,sub+sh-disc)};
}

function doLogin() {
  const u=(document.getElementById('lu').value||'').trim().toLowerCase();
  const p=document.getElementById('lp').value;
  const user=users.find(x=>x.username===u&&x.password===p);
  if(!user){document.getElementById('lerr').style.display='block';return;}
  currentUser=user; updateAuthBtn(); closeAuthModal();
  notify('Welcome back, '+(user.displayName||user.username)+'! 🤘');
}

function doRegister() {
  const u=(document.getElementById('ru').value||'').trim().toLowerCase().replace(/\s+/g,'_');
  const n=(document.getElementById('rn').value||'').trim();
  const p=document.getElementById('rp').value;
  const p2=document.getElementById('rp2').value;
  const err=document.getElementById('rerr');
  if(!u||!p){err.textContent='Username and password required.';err.style.display='block';return;}
  if(p.length<6){err.textContent='Password must be 6+ chars.';err.style.display='block';return;}
  if(p!==p2){err.textContent='Passwords do not match.';err.style.display='block';return;}
  if(users.find(x=>x.username===u)){err.textContent='Username taken.';err.style.display='block';return;}
  const nu={username:u,displayName:n,password:p,orders:[]};
  users.push(nu); currentUser=nu; updateAuthBtn(); closeAuthModal();
  saveUsers();
  notify('Account created! Welcome, '+(n||u)+'! 🤘');
}

function doLogout() { currentUser=null; updateAuthBtn(); closeAuthModal(); notify('Logged out. See ya! 🤘'); }

  const statusSteps=['pending','confirmed','shipped','delivered'];

            <div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:${i<=si?SC.accentColor:'#333'}">${s}</div>
          </div>${i<statusSteps.length-1?`<div style="flex:1;height:2px;background:${i<si?SC.accentColor:'#1a1a1a'};margin-top:13px;max-width:40px"></div>`:''}`).join('')}
      </div>
      <div style="font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><div style="color:#444;font-size:10px;letter-spacing:1px;margin-bottom:2px">DATE</div>${order.date}</div>

  if(search) p=p.filter(x=>x.name.toLowerCase().includes(search)||x.itemCode.toLowerCase().includes(search));
  if(sort==='price-asc') p.sort((a,b)=>a.price-b.price);
  if(sort==='price-desc') p.sort((a,b)=>b.price-a.price);

      <div style="font-weight:700;font-size:13px;margin-bottom:8px;line-height:1.4">${item.name}</div>
      <div style="margin-bottom:3px">${starsHTML(item.rating,12)}</div>
      <div style="font-size:10px;color:#2a2a2a;margin-bottom:9px">${item.reviews.length} reviews</div>

        <span class="bebas" style="font-size:22px;color:${SC.accentColor}">${item.isSold?'SOLD':'$'+item.price.toFixed(2)}</span>

function addToCart(id) {
  const p=products.find(x=>x.id===id);
  if(!p||p.isSold)return;
  const ex=cart.find(x=>x.id===id);
  if(ex) ex.qty++; else cart.push({...p,qty:1});
  updateCartBadge();
  notify('"'+p.name+'" added to cart! 🤘');
  const card=document.querySelector('[data-pid="'+id+'"]');
  if(card){card.style.animation='riff .6s ease';setTimeout(()=>card.style.animation='',700);}
}

function removeFromCart(id){cart=cart.filter(x=>x.id!==id);updateCartBadge();renderCart();}
function changeQty(id,d){const i=cart.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<1)removeFromCart(id);else{updateCartBadge();renderCart();}}

function submitReview() {
  const author=(document.getElementById('rev-author').value||'').trim();
  const text=(document.getElementById('rev-text').value||'').trim();
  if(!author||!text){notify('Fill in your name and review.','red');return;}
  const p=products.find(x=>x.id===currentProductId);
  p.reviews.push({rating:reviewStars,author,text,date:new Date().toLocaleDateString()});
  p.rating=Math.round(p.reviews.reduce((s,r)=>s+r.rating,0)/p.reviews.length*10)/10;
  notify('Review posted! 🤘','green');
  openProduct(currentProductId);
}

function applyCoupon() {
  const code=((document.getElementById('cp-in')||{}).value||'').trim().toUpperCase();
  if(!code)return;
  const c=coupons.find(x=>x.code===code&&x.active);
  if(!c){notify('Invalid or expired coupon.','red');return;}
  if(c.oneUse&&c.usedBy.length>0){notify('This coupon has already been used.','red');return;}
  const {sub}=calcCart();
  if(c.minOrder&&sub<c.minOrder){notify('Min. order $'+c.minOrder+' required.','red');return;}
  appliedCoupon=c;
  notify(c.giftFrom?`🎁 ${c.giftFrom} gifted you ${c.type==='percent'?c.value+'% off':'$'+c.value+' off'}!`:'Coupon applied! 🤘','green');
  renderCart();
}
function removeCoupon(){appliedCoupon=null;renderCart();}

function placeOrder() {
  const {total}=calcCart();
  const payL={cash:'Cash',bank:'Bank Transfer',crypto:'Crypto',paypal:'PayPal/Revolut'};
  const oid='ORD-'+(nextOrderId++);
  const order={
    id:oid,date:new Date().toLocaleDateString(),
    items:cart.map(i=>({name:i.name,qty:i.qty,price:i.price,itemCode:i.itemCode})),
    total:total.toFixed(2),delivery:selectedDelivery,payment:payL[selectedPayment]||selectedPayment,
    contact:{...orderContact},meetLocation:orderMeetLocation,
    status:'pending',username:currentUser?currentUser.username:'guest',adminNote:'',
    couponCode:appliedCoupon?appliedCoupon.code:'',
  };
  allOrders.push(order);
  // Reduce stock
  cart.forEach(ci=>{const p=products.find(x=>x.id===ci.id);if(p){p.stock=Math.max(0,p.stock-ci.qty);p.sold=(p.sold||0)+ci.qty;}});
  if(currentUser){currentUser.orders=currentUser.orders||[];currentUser.orders.unshift({id:oid,date:order.date,total:order.total,delivery:selectedDelivery,payment:order.payment,status:'pending'});}
  if(appliedCoupon){appliedCoupon.usedBy.push(orderContact.name);if(appliedCoupon.oneUse)appliedCoupon.active=false;appliedCoupon=null;}
  cart=[];updateCartBadge();saveOrders();saveProducts();
  orderContact={name:'',phone:'',address:'',city:'',zip:'',country:'',note:''};orderMeetLocation='';
  document.getElementById('checkout-content').innerHTML=`
    <div style="text-align:center;padding:50px 20px" class="fade-up">
      <div style="font-size:72px;margin-bottom:18px">🤘</div>

      <p style="color:#555;font-size:13px;margin-bottom:20px">Order <strong style="color:${SC.accentColor}">${oid}</strong> has been received.</p>
      <div class="card-panel" style="max-width:400px;margin:0 auto 22px;text-align:left;font-size:12px;background:#0a0a0a;border-color:#1a1a1a">
        <div style="color:${SC.accentColor};font-weight:700;margin-bottom:7px">We'll reach you at: ${order.contact.phone}</div>
        <div style="color:#444;line-height:1.8">Track your order anytime with ID: <span style="color:#f0ede6">${oid}</span><br>Reach us: ${SC.adminContact.instagram} · ${SC.adminContact.telegram}</div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="showView('shop')" style="padding:11px 24px">Continue Shopping</button>
        <button class="btn btn-ghost" onclick="openTrackModal('${oid}')" style="padding:11px 24px">Track Order</button>
      </div>
    </div>`;
}

function togEP(id){
  const p=document.getElementById('ep-'+id),b=document.getElementById('epbtn-'+id);
  const open=p.style.display==='none';
  p.style.display=open?'block':'none';b.textContent=open?'▲ Close':'▼ Edit';
  // Live color preview on input change
  if(open){
    const ci=document.getElementById('ep-colors-'+id);
    if(ci) ci.oninput=function(){
      const prev=document.getElementById('ep-color-preview-'+id);
      if(prev) prev.innerHTML=this.value.split(',').filter(c=>c.trim()).map(c=>`<span class="color-swatch-pick" style="background:${c.trim()};width:22px;height:22px" title="${c.trim()}"></span>`).join('');
    };
  }
}

function saveProduct(id){
  const p=products.find(x=>x.id===id);
  p.name=document.getElementById('ep-name-'+id).value||p.name;
  p.category=document.getElementById('ep-cat-'+id).value;
  p.image=document.getElementById('ep-emoji-'+id).value||p.image;
  p.itemCode=document.getElementById('ep-code-'+id).value||p.itemCode;
  const np=parseFloat(document.getElementById('ep-price-'+id).value)||0;
  const ns=parseInt(document.getElementById('ep-stock-'+id).value)||0;
  const sale=parseInt(document.getElementById('ep-sale-'+id).value)||0;
  const descEl=document.getElementById('ep-desc-'+id);
  if(descEl) p.description=descEl.innerHTML;
  const sizesRaw=(document.getElementById('ep-sizes-'+id).value||'').trim();
  p.sizes=sizesRaw?sizesRaw.split(',').map(s=>s.trim()).filter(Boolean):[];
  const colorsRaw=(document.getElementById('ep-colors-'+id).value||'').trim();
  p.colors=colorsRaw?colorsRaw.split(',').map(c=>c.trim()).filter(Boolean):[];
  p.originalPrice=np;p.stock=ns;p.sale=sale;
  p.price=sale>0?Math.round(np*(1-sale/100)*100)/100:np;
  p.showLowStock=document.getElementById('ep-lowstock-'+id).checked;
  p.isSold=document.getElementById('ep-sold-'+id).checked;
  notify('Product updated! 🤘','green');
  saveProducts();
  renderAPProducts();renderShop();
}

function handleEditImg(input,id){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{
    products.find(x=>x.id===id).imageUrl=e.target.result;
    const w=document.getElementById('ep-imgp-'+id);
    if(w) w.innerHTML=`<img src="${e.target.result}" style="width:56px;height:56px;object-fit:cover;border-radius:3px;border:1px solid ${SC.accentColor}">`;
    notify('Image uploaded — save to confirm.','green');
  };r.readAsDataURL(f);
}
function rmProductImg(id){const p=products.find(x=>x.id===id);if(p)p.imageUrl='';renderAPProducts();}
function delProduct(id){if(!confirm('Delete this product?'))return;products=products.filter(x=>x.id!==id);notify('Deleted.','red');saveProducts();renderAPProducts();renderShop();}
function rmSale(id){const p=products.find(x=>x.id===id);p.price=p.originalPrice;p.sale=0;notify('Sale removed.');renderAPProducts();renderShop();}
function removeAllSales(){products.forEach(p=>{p.price=p.originalPrice;p.sale=0;});notify('All sales removed.');renderAPProducts();renderShop();}
function applyGlobalSale(){const pct=parseInt((document.getElementById('glo-pct')||{}).value)||0;if(pct<1||pct>99){notify('Enter 1-99%.','red');return;}products.forEach(p=>{p.sale=pct;p.price=Math.round(p.originalPrice*(1-pct/100)*100)/100;});notify(pct+'% applied to all products!','green');renderAPProducts();renderShop();}

function ec(id,cmd,val){const e=document.getElementById(id);if(!e)return;e.focus();document.execCommand(cmd,false,val||null);}
function ei(id,txt){const e=document.getElementById(id);if(!e)return;e.focus();document.execCommand('insertText',false,txt);}
function elink(id){const u=prompt('URL:');if(u){const e=document.getElementById(id);if(e){e.focus();document.execCommand('createLink',false,u);}}}

      <div><div style="font-size:10px;color:#444;margin-bottom:2px">NEW PRICE ($)</div><input id="bk-price" type="number" style="width:110px" placeholder="e.g. 49.99" min="0" step="0.01"></div>
    </div>
    <div id="bulk-list">
      ${products.map(p=>`
        <div class="card-panel" style="margin-bottom:7px;display:flex;align-items:center;gap:11px">
          <label class="checkbox-wrap" style="flex-shrink:0"><input type="checkbox" value="${p.id}" ${selectedProductIds.has(p.id)?'checked':''} onchange="toggleBulkSel(${p.id},this.checked)"></label>
          <div style="width:34px;height:34px;background:#0a0a0a;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0">${p.imageUrl?`<img src="${p.imageUrl}" style="width:100%;height:100%;object-fit:cover">`:`<span style="font-size:16px">${p.image||'📦'}</span>`}</div>

function toggleBulkSel(id,c){if(c)selectedProductIds.add(id);else selectedProductIds.delete(id);const lbl=document.getElementById('bulk-count');if(lbl)lbl.textContent=selectedProductIds.size+' selected';}
function toggleSelAll(c){selectedProductIds=c?new Set(products.map(p=>p.id)):new Set();renderAPBulk();}
function bulkSale(){if(!selectedProductIds.size){notify('Select at least one.','red');return;}const pct=parseInt((document.getElementById('bk-sale')||{}).value)||0;if(pct<1||pct>99){notify('Enter 1-99%.','red');return;}products.filter(p=>selectedProductIds.has(p.id)).forEach(p=>{p.sale=pct;p.price=Math.round(p.originalPrice*(1-pct/100)*100)/100;});notify(pct+'% applied!','green');saveProducts();renderAPBulk();renderAPProducts();renderShop();}
function bulkRmSale(){if(!selectedProductIds.size){notify('Select at least one.','red');return;}products.filter(p=>selectedProductIds.has(p.id)).forEach(p=>{p.sale=0;p.price=p.originalPrice;});notify('Sale removed.','green');saveProducts();renderAPBulk();renderAPProducts();renderShop();}
function bulkPrice(){if(!selectedProductIds.size){notify('Select at least one.','red');return;}const price=parseFloat((document.getElementById('bk-price')||{}).value)||0;if(!price){notify('Enter a valid price.','red');return;}products.filter(p=>selectedProductIds.has(p.id)).forEach(p=>{p.originalPrice=price;p.price=p.sale>0?Math.round(price*(1-p.sale/100)*100)/100:price;});notify('Price updated.','green');saveProducts();renderAPBulk();renderAPProducts();renderShop();}
function bulkMarkSold(){if(!selectedProductIds.size){notify('Select at least one.','red');return;}products.filter(p=>selectedProductIds.has(p.id)).forEach(p=>p.isSold=true);notify('Marked as SOLD.','green');saveProducts();renderAPBulk();renderAPProducts();renderShop();}
function bulkDelete(){if(!selectedProductIds.size){notify('Select at least one.','red');return;}if(!confirm('Delete '+selectedProductIds.size+' product(s)?'))return;products=products.filter(p=>!selectedProductIds.has(p.id));selectedProductIds.clear();notify('Deleted.','red');saveProducts();renderAPBulk();renderAPProducts();renderShop();}

// ---- STOCK PANEL ----
function renderAPStock(){
  const el=document.getElementById('ap-stock');if(!el)return;
  const totalStock=products.reduce((s,p)=>s+p.stock,0);
  const totalSold=products.reduce((s,p)=>s+(p.sold||0),0);
  el.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px">
      <div class="stat-card"><div class="stat-num">${totalStock}</div><div class="stat-label">Total In Stock</div></div>
      <div class="stat-card"><div class="stat-num">${totalSold}</div><div class="stat-label">Total Sold</div></div>
      <div class="stat-card"><div class="stat-num">${products.filter(p=>p.stock===0||p.isSold).length}</div><div class="stat-label">Out of Stock</div></div>
      <div class="stat-card"><div class="stat-num">${products.filter(p=>p.stock>0&&p.stock<=3&&!p.isSold).length}</div><div class="stat-label">Low Stock</div></div>
    </div>
    <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:${SC.accentColor};margin-bottom:12px">ADJUST STOCK</div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:560px">
        <thead><tr style="border-bottom:1px solid #1e1e1e">${['Item','Code','Category','Stock','Sold','Sale','Adjust'].map(h=>`<th style="text-align:left;padding:8px;color:#333;font-size:10px;letter-spacing:1px;text-transform:uppercase">${h}</th>`).join('')}</tr></thead>
        <tbody>
          ${products.sort((a,b)=>a.stock-b.stock).map(p=>`
            <tr style="border-bottom:1px solid #111" onmouseover="this.style.background='#0d0d0d'" onmouseout="this.style.background='transparent'">
              <td style="padding:9px 8px;font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}${p.isSold?' <span class="badge" style="background:#555;font-size:9px">SOLD</span>':''}</td>
              <td style="padding:9px 8px;color:#444">${p.itemCode}</td>
              <td style="padding:9px 8px;color:#444">${p.category}</td>
              <td style="padding:9px 8px;color:${p.stock===0?'#c0392b':p.stock<=3?'#e67e22':SC.accentColor};font-weight:700">${p.stock}</td>
              <td style="padding:9px 8px;color:#555">${p.sold||0}</td>
              <td style="padding:9px 8px">${p.sale>0?`<span class="badge" style="font-size:9px">-${p.sale}%</span>`:'—'}</td>
              <td style="padding:9px 8px">
                <div style="display:flex;align-items:center;gap:6px">
                  <input type="number" id="stk-${p.id}" value="${p.stock}" min="0" style="width:70px;padding:5px 8px;font-size:12px">
                  <button class="btn btn-sm" onclick="adjustStock(${p.id})">Set</button>
                  <button class="btn btn-ghost btn-sm" onclick="adjustStockDelta(${p.id},1)">+1</button>
                  <button class="btn btn-ghost btn-sm" onclick="adjustStockDelta(${p.id},-1)">-1</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function adjustStock(id){const inp=document.getElementById('stk-'+id);if(!inp)return;const p=products.find(x=>x.id===id);if(!p)return;p.stock=Math.max(0,parseInt(inp.value)||0);notify('Stock updated for '+p.name,'green');saveProducts();renderAPStock();renderShop();}
function adjustStockDelta(id,d){const p=products.find(x=>x.id===id);if(!p)return;p.stock=Math.max(0,p.stock+d);const inp=document.getElementById('stk-'+id);if(inp)inp.value=p.stock;notify('Stock: '+p.name+' → '+p.stock,'green');saveProducts();renderAPStock();renderShop();}

            <span class="bebas" style="font-size:17px;color:${SC.accentColor};letter-spacing:2px">${o.id}</span>

            ${['pending','confirmed','shipped','delivered','cancelled'].map(s=>`<button class="btn btn-sm${(o.status||'pending')===s?' btn-success':' btn-ghost'}" onclick="setOrderStatus('${o.id}','${s}')" style="font-size:10px;padding:4px 9px">${s}</button>`).join('')}
          </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;font-size:12px;margin-bottom:9px">

function setOrderStatus(id,status){
  const o=allOrders.find(x=>x.id===id);if(!o)return;
  o.status=status;
  users.forEach(u=>{const uo=(u.orders||[]).find(x=>x.id===id);if(uo)uo.status=status;});
  notify('Order '+id+' → '+status,'green');
  saveOrders();
  renderAPOrders();
}

function saveAdminNote(id){
  const o=allOrders.find(x=>x.id===id);if(!o)return;
  const inp=document.getElementById('anote-'+id);
  o.adminNote=inp?inp.value.trim():'';
  users.forEach(u=>{const uo=(u.orders||[]).find(x=>x.id===id);if(uo)uo.adminNote=o.adminNote;});
  notify('Note saved.','green');saveOrders();renderAPOrders();
}

function renderAPCoupons(){
  const el=document.getElementById('ap-coupons');if(!el)return;
  el.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px">

    </div>`;
  renderCouponTypeFields();renderCouponList();

function renderCouponTypeFields(){
  const el=document.getElementById('cp-type-fields');if(!el)return;
  const t=(document.getElementById('cp-type')||{}).value||'percent';
  if(t==='percent') el.innerHTML=`<div><div style="font-size:10px;color:#444;margin-bottom:3px;letter-spacing:1px">DISCOUNT % *</div><input id="cp-value" type="number" min="1" max="99" placeholder="e.g. 15"></div>`;
  else if(t==='fixed') el.innerHTML=`<div><div style="font-size:10px;color:#444;margin-bottom:3px;letter-spacing:1px">DISCOUNT ($) *</div><input id="cp-value" type="number" min="0.01" step="0.01" placeholder="e.g. 20"></div>`;
  else el.innerHTML=`
    <div><div style="font-size:10px;color:#444;margin-bottom:3px;letter-spacing:1px">GIFT VALUE ($) *</div><input id="cp-value" type="number" min="0.01" step="0.01" placeholder="e.g. 50"></div>
    <div><div style="font-size:10px;color:#444;margin-bottom:3px;letter-spacing:1px">GIFTED FROM *</div><input id="cp-giftfrom" placeholder="e.g. George"></div>
    <div><div style="font-size:10px;color:#444;margin-bottom:3px;letter-spacing:1px">PERSONAL MESSAGE</div><textarea id="cp-giftmsg" rows="2" placeholder="Happy birthday! 🤘" style="resize:vertical;background:#1a1a1a;border:1px solid #2a2a2a;color:#f0ede6;font-family:'Space Mono',monospace;padding:8px 12px;border-radius:3px;font-size:12px;width:100%;outline:none"></textarea></div>`;
}

function createCoupon(){
  const code=((document.getElementById('cp-code')||{}).value||'').trim().toUpperCase();
  const type=(document.getElementById('cp-type')||{}).value||'percent';
  const value=parseFloat((document.getElementById('cp-value')||{}).value)||0;
  const desc=((document.getElementById('cp-desc')||{}).value||'').trim();
  const minOrder=parseFloat((document.getElementById('cp-min')||{}).value)||0;
  const oneUse=(document.getElementById('cp-1use')||{}).checked||false;
  if(!code){notify('Enter a code.','red');return;}
  if(!value){notify('Enter a discount value.','red');return;}
  if(coupons.find(c=>c.code===code)){notify('Code already exists.','red');return;}
  let giftFrom='',giftMessage='';
  if(type==='gift'){
    giftFrom=((document.getElementById('cp-giftfrom')||{}).value||'').trim();
    giftMessage=((document.getElementById('cp-giftmsg')||{}).value||'').trim();
    if(!giftFrom){notify("Enter the gifter's name.",'red');return;}
  }
  coupons.push({code,type,value,description:desc,minOrder,usedBy:[],active:true,giftFrom,giftMessage,oneUse:type==='gift'?true:oneUse});
  notify('Coupon '+code+' created! 🎫','green');
  saveCoupons();
  document.getElementById('cp-code').value='';
  renderCouponTypeFields();renderCouponList();
}

function renderCouponList(){
  const el=document.getElementById('coupon-list');if(!el)return;
  if(!coupons.length){el.innerHTML='<div style="color:#222;font-size:12px">No coupons yet.</div>';return;}
  el.innerHTML=coupons.map((c,i)=>`
    <div class="${c.type==='gift'?'gift-coupon':'card-panel'}" style="margin-bottom:9px${c.type!=='gift'?';border-color:#1a1a1a':''}">
      ${c.type==='gift'?`<div style="font-size:10px;color:${SC.accentColor};letter-spacing:2px;margin-bottom:5px">🎁 FROM ${(c.giftFrom||'').toUpperCase()}</div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:7px">
        <div>
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
            <span class="bebas" style="font-size:17px;color:${c.active?SC.accentColor:'#333'};letter-spacing:2px">${c.code}</span>
            <span class="badge" style="background:${c.active?'#27ae60':'#1a1a1a'};font-size:9px">${c.active?'ON':'OFF'}</span>
          </div>
          <div style="font-size:11px;color:#444">${c.type==='percent'?c.value+'% off':'$'+c.value+' off'}${c.minOrder>0?' · min $'+c.minOrder:''}${c.oneUse?' · 1×':''}</div>
          ${c.description?`<div style="font-size:10px;color:#2a2a2a;margin-top:1px">${c.description}</div>`:''}
          ${c.giftMessage?`<div style="font-size:10px;color:#555;font-style:italic;margin-top:3px">"${c.giftMessage}"</div>`:''}
          <div style="font-size:10px;color:#1e1e1e;margin-top:3px">Used ${c.usedBy.length}×</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <button class="btn btn-ghost btn-sm" onclick="togCoupon(${i})">${c.active?'Pause':'Resume'}</button>
          <button class="btn btn-danger btn-sm" onclick="delCoupon(${i})">Delete</button>
        </div>
      </div>
    </div>`).join('');
}

function togCoupon(i){coupons[i].active=!coupons[i].active;saveCoupons();notify('Coupon '+(coupons[i].active?'activated':'paused')+'.');renderCouponList();}
function delCoupon(i){const code=coupons[i].code;coupons.splice(i,1);saveCoupons();notify('Coupon '+code+' deleted.','red');renderCouponList();}

function sendAdminMsg(user){
  const inp=document.getElementById('admin-msg-input');
  const text=(inp.value||'').trim();if(!text)return;
  if(!adminConvos[user]) adminConvos[user]=[];
  adminConvos[user].push({from:'admin',text,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  inp.value='';
  // Push to customer chat
  if(user!=='guest'){
    const u=users.find(x=>x.username===user);
    if(u) u._pendingAdminMsgs=(u._pendingAdminMsgs||[]).concat([text]);
  } else {
    window._guestPendingAdminMsgs=(window._guestPendingAdminMsgs||[]).concat([text]);
  }
  saveChat();
  renderAdminConvoPanel(user);
}

function useQuickReply(text){
  const inp=document.getElementById('admin-msg-input');

}

// ==================== SUPPORT CHAT (CUSTOMER SIDE) ====================
function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById('chat-window').classList.toggle('open',chatOpen);
  if(chatOpen&&chatMessages.length===0){
    addChatMsg('support','Hey! 👋 What can I help you with? I\'ll reply directly.');
  }
  // Pull pending admin messages
  checkPendingAdminMsgs();
}

function checkPendingAdminMsgs(){
  const user=currentUser?currentUser.username:'guest';
  let pending=currentUser?(currentUser._pendingAdminMsgs||[]):(window._guestPendingAdminMsgs||[]);
  pending.forEach(txt=>{addChatMsg('support',txt);});
  if(currentUser) currentUser._pendingAdminMsgs=[];
  else window._guestPendingAdminMsgs=[];
}

function addChatMsg(type,text){
  chatMessages.push({type,text,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  renderChatMsgs();
}

function renderChatMsgs(){
  const el=document.getElementById('chat-messages');if(!el)return;
  el.innerHTML=chatMessages.map(m=>`
    <div class="chat-msg ${m.type}">
      ${m.text}
      <div style="font-size:9px;opacity:.4;margin-top:3px;text-align:${m.type==='user'?'right':'left'}">${m.time}</div>
    </div>`).join('');
  el.scrollTop=el.scrollHeight;
}

function sendChatMsg(){
  const inp=document.getElementById('chat-input');
  const text=(inp.value||'').trim();if(!text)return;
  addChatMsg('user',text);
  inp.value='';
  // Store in adminConvos
  const user=currentUser?currentUser.username:'guest';
  if(!adminConvos[user]) adminConvos[user]=[];
  adminConvos[user].push({from:'user',text,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  saveChat();
  // Show "received" notice
  setTimeout(()=>{
    checkPendingAdminMsgs();
    if(chatMessages[chatMessages.length-1]?.from!=='admin'){
      addChatMsg('support','✓ Message received! I\'ll reply as soon as possible. You can also reach us at '+SC.adminContact.instagram);
    }
  },1200);
}

// ==================== EXPORT / IMPORT ====================
function exportSiteData(){
  const data={products,users:users.map(u=>({...u,password:undefined})),allOrders,coupons,SC,categories,nextProductId,nextOrderId,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vaulture-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  notify('Data exported! 📤','green');
}
function importSiteData(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();r.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.products) products=data.products;
      if(data.allOrders) allOrders=data.allOrders;
      if(data.coupons) coupons=data.coupons;
      if(data.SC) SC={...SC,...data.SC};
      if(data.categories) categories=data.categories;
      if(data.nextProductId) nextProductId=data.nextProductId;
      if(data.nextOrderId) nextOrderId=data.nextOrderId;
      await saveAll();
      applyLoadedSC();
      renderShop();
      notify('Data imported and saved! ✓','green');
    }catch(err){notify('Import failed — invalid file.','red');}
  };r.readAsText(f);
}

// ==================== PERSISTENT STORAGE ====================
// All data is saved to window.storage so it syncs across devices & persists on reload.

const STORE_KEYS = {
  products: 'vaulture:products',
  users: 'vaulture:users',
  orders: 'vaulture:orders',
  coupons: 'vaulture:coupons',
  SC: 'vaulture:sc',
  categories: 'vaulture:categories',
  nextProductId: 'vaulture:nextProductId',
  nextOrderId: 'vaulture:nextOrderId',
  adminConvos: 'vaulture:adminConvos',
  quickReplies: 'vaulture:quickReplies',
};

async function saveAll() {
  try {
    await window.storage.set(STORE_KEYS.products, JSON.stringify(products));
    await window.storage.set(STORE_KEYS.users, JSON.stringify(users));
    await window.storage.set(STORE_KEYS.orders, JSON.stringify(allOrders));
    await window.storage.set(STORE_KEYS.coupons, JSON.stringify(coupons));
    await window.storage.set(STORE_KEYS.SC, JSON.stringify(SC));
    await window.storage.set(STORE_KEYS.categories, JSON.stringify(categories));
    await window.storage.set(STORE_KEYS.nextProductId, String(nextProductId));
    await window.storage.set(STORE_KEYS.nextOrderId, String(nextOrderId));
    await window.storage.set(STORE_KEYS.adminConvos, JSON.stringify(adminConvos));
    await window.storage.set(STORE_KEYS.quickReplies, JSON.stringify(quickReplies));
  } catch(e) { console.warn('Storage save error:', e); }
}

async function saveProducts() {
  try { await window.storage.set(STORE_KEYS.products, JSON.stringify(products)); await window.storage.set(STORE_KEYS.nextProductId, String(nextProductId)); } catch(e){}
}
async function saveOrders() {
  try { await window.storage.set(STORE_KEYS.orders, JSON.stringify(allOrders)); await window.storage.set(STORE_KEYS.nextOrderId, String(nextOrderId)); await window.storage.set(STORE_KEYS.users, JSON.stringify(users)); } catch(e){}
}
async function saveUsers() { try { await window.storage.set(STORE_KEYS.users, JSON.stringify(users)); } catch(e){} }
async function saveSC() { try { await window.storage.set(STORE_KEYS.SC, JSON.stringify(SC)); } catch(e){} }
async function saveCoupons() { try { await window.storage.set(STORE_KEYS.coupons, JSON.stringify(coupons)); } catch(e){} }
async function saveCategories() { try { await window.storage.set(STORE_KEYS.categories, JSON.stringify(categories)); } catch(e){} }
async function saveChat() { try { await window.storage.set(STORE_KEYS.adminConvos, JSON.stringify(adminConvos)); await window.storage.set(STORE_KEYS.quickReplies, JSON.stringify(quickReplies)); } catch(e){} }

async function loadAll() {
  try {
    const prodR = await window.storage.get(STORE_KEYS.products);
    if (prodR) products = JSON.parse(prodR.value);
    const userR = await window.storage.get(STORE_KEYS.users);
    if (userR) users = JSON.parse(userR.value);
    const ordR = await window.storage.get(STORE_KEYS.orders);
    if (ordR) allOrders = JSON.parse(ordR.value);
    const couR = await window.storage.get(STORE_KEYS.coupons);
    if (couR) coupons = JSON.parse(couR.value);
    const scR = await window.storage.get(STORE_KEYS.SC);
    if (scR) { const saved = JSON.parse(scR.value); SC = {...SC, ...saved}; }
    const catR = await window.storage.get(STORE_KEYS.categories);
    if (catR) categories = JSON.parse(catR.value);
    const npR = await window.storage.get(STORE_KEYS.nextProductId);
    if (npR) nextProductId = parseInt(npR.value) || nextProductId;
    const noR = await window.storage.get(STORE_KEYS.nextOrderId);
    if (noR) nextOrderId = parseInt(noR.value) || nextOrderId;
    const chatR = await window.storage.get(STORE_KEYS.adminConvos);
    if (chatR) adminConvos = JSON.parse(chatR.value);
    const qrR = await window.storage.get(STORE_KEYS.quickReplies);
    if (qrR) quickReplies = JSON.parse(qrR.value);
  } catch(e) { console.warn('Storage load error:', e); }
}

// ==================== INIT ====================
(async () => {
  // Show loading state
  document.getElementById('product-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;font-family:\'Bebas Neue\';font-size:22px;color:#1e1e1e;letter-spacing:3px">LOADING...</div>';
  await loadAll();
  // Apply loaded SC settings to DOM
  applyLoadedSC();
  renderShop();
  updateAuthBtn();
  // Auto-save every 30 seconds as backup
  setInterval(saveAll, 30000);
  // Live sync: reload products, orders from storage every 15s so changes on another device appear
  setInterval(async () => {
    try {
      const prodR = await window.storage.get(STORE_KEYS.products);
      if (prodR) { const saved = JSON.parse(prodR.value); if(JSON.stringify(saved) !== JSON.stringify(products)){ products = saved; renderShop(); } }
      const ordR = await window.storage.get(STORE_KEYS.orders);
      if (ordR) { const saved = JSON.parse(ordR.value); if(JSON.stringify(saved) !== JSON.stringify(allOrders)){ allOrders = saved; } }
      const scR = await window.storage.get(STORE_KEYS.SC);
      if (scR) { const saved = JSON.parse(scR.value); if(JSON.stringify(saved) !== JSON.stringify(SC)){ SC = {...SC, ...saved}; applyLoadedSC(); } }
    } catch(e){}
  }, 15000);
})();

function applyLoadedSC() {
  document.getElementById('site-title-tag').textContent = SC.logoEmoji + ' ' + SC.siteName;
  document.getElementById('header-logo').textContent = SC.logoEmoji + ' ' + SC.siteName;
  document.getElementById('header-tagline').textContent = SC.tagline;
  document.getElementById('chat-header-name').textContent = SC.logoEmoji + ' ' + SC.siteName + ' SUPPORT';
  const hl = document.getElementById('shop-headline');
  if (hl) { const parts = SC.headline.split(' '); hl.innerHTML = `<span style="color:${SC.accentColor}">${parts[0]}</span> ${parts.slice(1).join(' ')}`; }
  const sl = document.getElementById('shop-subline');
  if (sl) sl.textContent = SC.subline;
  const ft = document.getElementById('footer-text');
  if (ft) ft.textContent = SC.footerText;
  if (SC.bodyFont) {
    const fo = (typeof FONT_OPTIONS !== 'undefined') ? FONT_OPTIONS.find(x=>x.name===SC.bodyFont) : null;
    document.body.style.fontFamily = fo ? fo.css : (SC.bodyFont + ', monospace');
  }
  if (SC.bgColor) document.body.style.background = SC.bgColor;
  if (SC.cardColor) {
    const style = document.getElementById('dynamic-card-style') || (() => { const s = document.createElement('style'); s.id = 'dynamic-card-style'; document.head.appendChild(s); return s; })();
    style.textContent = `.product-card,.card-panel{background:${SC.cardColor}!important} body{background:${SC.bgColor||'#0d0d0d'}!important}`;
  }
  if (SC.headingFont) {
    const style3 = document.getElementById('dynamic-hfont-style') || (() => { const s = document.createElement('style'); s.id = 'dynamic-hfont-style'; document.head.appendChild(s); return s; })();
    style3.textContent = `.bebas{font-family:'${SC.headingFont}',sans-serif!important}`;
  }
  if (SC.buttonRadius) {
    const style2 = document.getElementById('dynamic-btn-style') || (() => { const s = document.createElement('style'); s.id = 'dynamic-btn-style'; document.head.appendChild(s); return s; })();
    style2.textContent = `.btn,.filter-btn,.qty-btn{border-radius:${SC.buttonRadius}!important}`;
  }
}
</script>
